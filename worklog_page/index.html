<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quant Strategy 工作紀錄</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --card:#141b2d; --line:#26324c; --text:#edf2ff; --muted:#9eabc7; --claude:#db8b5c; --codex:#5aa8ff; --good:#63d7a2; --warn:#e3b341; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    main { width:min(1180px,calc(100% - 28px)); margin:auto; padding:32px 0 48px; }
    header,section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; }
    h1,h2,h3,p { margin-top:0; } h1 { margin-bottom:6px; } h2 { font-size:1.2rem; }
    .muted,footer { color:var(--muted); } .error { border-color:#d65f5f; color:#ffd0d0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
    .kpi { font-size:1.6rem; font-weight:700; }
    .legend { display:flex; gap:16px; color:var(--muted); align-items:center; flex-wrap:wrap; } .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
    .dot.claude,.bar-claude { background:var(--claude); } .dot.codex,.bar-codex { background:var(--codex); }
    .tabs { display:flex; gap:8px; margin-bottom:14px; }
    .tabs button { background:var(--bg); color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:7px 18px; cursor:pointer; font:inherit; }
    .tabs button.active { color:var(--text); border-color:var(--codex); }
    .chip { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 12px; font-size:.8rem; color:var(--muted); margin-bottom:10px; }
    .chip.pass { color:var(--good); border-color:var(--good); }
    .chip.watch { color:var(--warn); border-color:var(--warn); }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:12px 0; }
    .tile { background:#0d1425; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    .tile .k { font-size:.72rem; letter-spacing:.05em; color:var(--muted); }
    .tile .v { font-size:1.25rem; font-weight:650; margin-top:2px; }
    .strategy { border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
    .strategy:first-of-type { border-top:0; padding-top:0; margin-top:0; }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); }
    .scroll { overflow:auto; } select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px; }
    canvas { width:100%; height:200px; background:#0d1425; border:1px solid var(--line); border-radius:8px; }
    .gantt { position:relative; border:1px solid var(--line); border-radius:8px; background:#0d1425; margin-top:12px; padding:6px 0 22px; }
    .gantt-row { position:relative; height:34px; margin:6px 0; }
    .gantt-label { position:absolute; left:8px; top:7px; color:var(--muted); font-size:.8rem; z-index:1; }
    .gantt-bar { position:absolute; top:5px; height:24px; border-radius:5px; min-width:3px; opacity:.9; }
    .gantt-ticks { position:absolute; inset:0; pointer-events:none; }
    .gantt-tick { position:absolute; top:0; bottom:0; border-left:1px solid #1a2338; }
    .gantt-tick span { position:absolute; bottom:2px; left:3px; color:#5c6a8a; font-size:.7rem; }
    .unionbar { background:#26324c; border-radius:4px; height:10px; min-width:2px; }
    .unionbar i { display:block; height:100%; border-radius:4px; background:var(--good); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    ul.activity { margin:6px 0 14px; padding-left:20px; } ul.activity li { margin:3px 0; }
    footer { text-align:center; padding:8px; }
    @media (max-width:600px) { main { width:min(100% - 16px,1180px); padding-top:12px; } header,section { padding:14px; } th,td { padding:6px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Quant Strategy 工作紀錄</h1>
    <p class="muted">每日彙整本機 AI 工時、工作摘要與候選策略狀態。本頁為公開頁;所有策略數據為研究用回測與模擬觀測,非實盤或 paper 交易績效,不構成投資建議,亦不代表任何策略已通過推廣或上線閘門。</p>
  </header>
  <section id="error" class="error" hidden><h2>資料載入失敗</h2><p id="error-message"></p></section>

  <section>
    <div class="grid"><div><h2>AI 工時</h2></div><div class="legend"><span><i class="dot claude"></i>Claude Code</span><span><i class="dot codex"></i>Codex</span><span><i class="dot" style="background:var(--good)"></i>去重合計</span></div></div>
    <div class="tabs"><button id="tab-day">日</button><button id="tab-week">週</button><button id="tab-month">月</button></div>
    <div id="hours-body"></div>
  </section>

  <section>
    <h2>候選策略</h2>
    <div id="strategies-body" class="muted">載入中…</div>
  </section>

  <section>
    <h2>每日工作摘要</h2>
    <div id="activity"></div>
  </section>

  <section>
    <h2>AI 產出索引</h2>
    <div class="scroll"><table><thead><tr><th>日期</th><th>類型</th><th>標題</th></tr></thead><tbody id="outputs"></tbody></table></div>
  </section>
  <footer>資料產生時間：<span id="generated-at">—</span> · 資料每日更新一次</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const text = value => value === null || value === undefined ? '—' : String(value);
const escapeHtml = value => text(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const fmtMin = minutes => { const m = Math.round(minutes || 0); return m >= 60 ? `${Math.floor(m/60)} 時 ${m%60} 分` : `${m} 分`; };
const hhmm = iso => new Date(iso).toTimeString().slice(0,5);
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayKey = iso => fmtDate(new Date(iso));
const mondayOf = dateStr => { const d = new Date(`${dateStr}T00:00:00`); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmtDate(d); };

async function fetchJson(path) {
  const response = await fetch(path, {cache:'no-store'});
  if (!response.ok) throw new Error(`${path}: ${response.status} ${response.statusText}`);
  return response.json();
}

let WORKLOG = null;

function optionList(select, values, render) {
  select.innerHTML = values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(render ? render(value) : value)}</option>`).join('');
}

function kpiRow(claude, codex, overlap, union) {
  return `<div class="grid">
    <div><div class="kpi">${fmtMin(claude)}</div><div class="muted">Claude Code</div></div>
    <div><div class="kpi">${fmtMin(codex)}</div><div class="muted">Codex</div></div>
    <div><div class="kpi">${fmtMin(overlap)}</div><div class="muted">重疊時段</div></div>
    <div><div class="kpi">${fmtMin(union)}</div><div class="muted">合計（去重）</div></div>
  </div>`;
}

function dayTable(rows, withDate = true) {
  const max = Math.max(1, ...rows.map(row => row.total_minutes || 0));
  return `<div class="scroll"><table><thead><tr>${withDate ? '<th>日期</th>' : ''}<th class="num">Claude</th><th class="num">Codex</th><th class="num">重疊</th><th class="num">合計（去重）</th><th style="width:30%"></th></tr></thead><tbody>${
    rows.map(row => `<tr>${withDate ? `<td>${escapeHtml(row.date)}</td>` : ''}<td class="num">${fmtMin(row.claude_minutes)}</td><td class="num">${fmtMin(row.codex_minutes)}</td><td class="num">${fmtMin(row.overlap_minutes)}</td><td class="num">${fmtMin(row.total_minutes)}</td><td><div class="unionbar"><i style="width:${100*(row.total_minutes||0)/max}%"></i></div></td></tr>`).join('')
  }</tbody></table></div>`;
}

function ganttHtml(sessions) {
  const ticks = Array.from({length:13}, (_, i) => `<div class="gantt-tick" style="left:${100*i/12}%"><span>${String(i*2).padStart(2,'0')}</span></div>`).join('');
  const row = tool => {
    const bars = sessions.filter(s => s.tool === tool).map(s => {
      const start = new Date(s.start), end = new Date(s.end);
      const from = start.getHours()*60 + start.getMinutes();
      const to = Math.max(from + 1, dayKey(s.end) === dayKey(s.start) ? end.getHours()*60 + end.getMinutes() : 1440);
      return `<div class="gantt-bar bar-${tool}" style="left:${100*from/1440}%;width:${100*(to-from)/1440}%" title="${escapeHtml(`${tool} ${hhmm(s.start)}–${hhmm(s.end)}（${fmtMin(s.duration_minutes)}，${s.event_count} 事件）`)}"></div>`;
    }).join('');
    return `<div class="gantt-row"><span class="gantt-label">${tool === 'claude' ? 'Claude Code' : 'Codex'}</span>${bars}</div>`;
  };
  return `<div class="gantt"><div class="gantt-ticks">${ticks}</div>${row('claude')}${row('codex')}</div>`;
}

function activityItems(items) {
  return `<ul class="activity">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
}

function renderDayView(container, date) {
  const daily = (WORKLOG.daily || []).find(row => row.date === date) || {claude_minutes:0, codex_minutes:0, overlap_minutes:0, total_minutes:0};
  const sessions = (WORKLOG.sessions || []).filter(s => dayKey(s.start) === date);
  const activity = (WORKLOG.daily_activity || []).find(row => row.date === date);
  const outputs = (WORKLOG.ai_outputs || []).filter(o => o.date === date);
  const sessionRows = sessions.map(s => `<tr><td>${s.tool === 'claude' ? 'Claude Code' : 'Codex'}</td><td>${hhmm(s.start)}–${hhmm(s.end)}</td><td class="num">${fmtMin(s.duration_minutes)}</td><td class="num">${s.event_count}</td></tr>`).join('');
  container.insertAdjacentHTML('beforeend', `
    ${kpiRow(daily.claude_minutes, daily.codex_minutes, daily.overlap_minutes, daily.total_minutes)}
    ${ganttHtml(sessions)}
    <h3 style="margin-top:14px">Sessions</h3>
    <div class="scroll"><table><thead><tr><th>工具</th><th>時段</th><th class="num">時長</th><th class="num">事件數</th></tr></thead><tbody>${sessionRows || '<tr><td colspan="4" class="muted">當日無紀錄。</td></tr>'}</tbody></table></div>
    <h3 style="margin-top:14px">當日工作</h3>
    ${activity ? activityItems(activity.items) : '<p class="muted">當日無版本紀錄。</p>'}
    <h3 style="margin-top:14px">當日 AI 產出（${outputs.length}）</h3>
    ${outputs.map(o => `<p style="margin:4px 0">${escapeHtml(o.title)} <span class="muted">· ${escapeHtml(o.type)}</span></p>`).join('') || '<p class="muted">當日無產出檔。</p>'}`);
}

function groupSum(rows, keyFn) {
  const groups = {};
  for (const row of rows) {
    const key = keyFn(row);
    const g = groups[key] ||= {key, days:[], claude_minutes:0, codex_minutes:0, overlap_minutes:0, total_minutes:0};
    g.days.push(row);
    g.claude_minutes += row.claude_minutes; g.codex_minutes += row.codex_minutes;
    g.overlap_minutes += row.overlap_minutes || 0; g.total_minutes += row.total_minutes;
  }
  return Object.values(groups).sort((a,b) => b.key.localeCompare(a.key));
}

function renderGroupView(container, groups, selectId, label, render) {
  container.insertAdjacentHTML('beforeend', `<p><label for="${selectId}">${label} </label><select id="${selectId}"></select></p><div id="${selectId}-body"></div>`);
  const select = $(selectId);
  optionList(select, groups.map(g => g.key), render);
  const show = () => {
    const g = groups.find(x => x.key === select.value) || groups[0];
    $(`${selectId}-body`).innerHTML = kpiRow(g.claude_minutes, g.codex_minutes, g.overlap_minutes, g.total_minutes) + dayTable(g.days);
  };
  select.addEventListener('change', show); show();
}

function renderHoursTab(tab) {
  for (const id of ['tab-day','tab-week','tab-month']) $(id).classList.toggle('active', id === `tab-${tab}`);
  const container = $('hours-body');
  container.innerHTML = '';
  const daily = [...(WORKLOG.daily || [])].sort((a,b) => b.date.localeCompare(a.date));
  if (!daily.length) { container.innerHTML = '<p class="muted">尚無工時資料。</p>'; return; }
  if (tab === 'day') {
    container.insertAdjacentHTML('beforeend', `<p><label for="day-select">日期 </label><select id="day-select"></select></p><div id="day-body"></div>`);
    optionList($('day-select'), daily.map(row => row.date));
    const show = () => { $('day-body').innerHTML = ''; renderDayView($('day-body'), $('day-select').value); };
    $('day-select').addEventListener('change', show); show();
  } else if (tab === 'week') {
    renderGroupView(container, groupSum(daily, row => mondayOf(row.date)), 'week-select', '週(週一起)', key => `${key} 當週`);
  } else {
    renderGroupView(container, groupSum(daily, row => row.date.slice(0,7)), 'month-select', '月份');
  }
}

function renderActivity(rows) {
  $('activity').innerHTML = rows.map(row => `<h3>${escapeHtml(row.date)}</h3>${activityItems(row.items)}`).join('') || '<p class="muted">尚無資料。</p>';
}

function renderOutputs(rows) {
  $('outputs').innerHTML = rows.map(row => `<tr><td>${escapeHtml(row.date)}</td><td>${escapeHtml(row.type)}</td><td>${escapeHtml(row.title)}</td></tr>`).join('') || '<tr><td colspan="3">沒有索引資料。</td></tr>';
}

function drawLine(canvas, values, color) {
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(260,canvas.clientWidth), height = canvas.clientHeight;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const ctx = canvas.getContext('2d'); ctx.scale(ratio,ratio); ctx.clearRect(0,0,width,height);
  const clean = values.map(Number).filter(Number.isFinite);
  if (!clean.length) { ctx.fillStyle='#9eabc7'; ctx.fillText('資料不可用',12,24); return; }
  let min = Math.min(...clean), max = Math.max(...clean); if (min === max) { min -= 1; max += 1; }
  ctx.strokeStyle='#26324c'; ctx.beginPath(); ctx.moveTo(8,height-18); ctx.lineTo(width-8,height-18); ctx.stroke();
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
  clean.forEach((value,index) => { const x=8+index*(width-16)/Math.max(1,clean.length-1); const y=8+(max-value)*(height-28)/(max-min); index ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.stroke(); ctx.fillStyle='#9eabc7'; ctx.fillText((max*100).toFixed(1)+'%',10,15); ctx.fillText((min*100).toFixed(1)+'%',10,height-4);
}

function fmtMetric(key, value) {
  if (value === null || value === undefined) return '—';
  if (typeof value !== 'number') return escapeHtml(value);
  if (key.includes('可信度')) return (value*100).toFixed(1) + '%';
  if (Number.isInteger(value)) return value.toLocaleString();
  return value.toFixed(2);
}

function strategyCard(s, index) {
  const chip = s.passed_statistical_gate ? '<span class="chip pass">通過統計驗證</span>' : '<span class="chip watch">觀察名單</span>';
  const tiles = s.metrics?.available === false
    ? `<p class="muted">${escapeHtml(s.metrics.reason)}</p>`
    : `<div class="tiles">${Object.entries(s.metrics || {}).map(([key,value]) => `<div class="tile"><div class="k">${escapeHtml(key)}</div><div class="v">${fmtMetric(key,value)}</div></div>`).join('')}</div>`;
  let extra = '';
  if (s.shadow) {
    extra = s.shadow.available === false
      ? `<p class="muted">模擬驗證資料不可用：${escapeHtml(s.shadow.reason)}</p>`
      : `<h3>模擬驗證進度（每日訊號、不下單）</h3><div class="tiles">
          <div class="tile"><div class="k">驗證週數</div><div class="v">${text(s.shadow.journal_weeks)} / ${text(s.shadow.minimum_weeks)}</div></div>
          <div class="tile"><div class="k">訊號日數</div><div class="v">${text(s.shadow.distinct_days)}</div></div>
          <div class="tile"><div class="k">紀錄筆數</div><div class="v">${text(s.shadow.total_records)}</div></div>
          <div class="tile"><div class="k">最後訊號日</div><div class="v" style="font-size:1rem">${text(s.shadow.last_event_date)}</div></div>
        </div>
        <p class="muted">狀態分佈：${Object.entries(s.shadow.status_counts || {}).map(([k,v]) => `${escapeHtml(k)} ×${v}`).join('、') || '—'}</p>`;
  }
  if (s.rebalances) {
    const legs = side => Object.entries(side || {}).map(([sym,usd]) => `${sym} $${Number(usd).toLocaleString()}`).join(', ');
    extra += s.rebalances.available === false
      ? `<p class="muted">換倉明細(各幣種多空金額)整備中：${escapeHtml(s.rebalances.reason)}</p>`
      : `<h3>換倉紀錄(每週,新到舊)</h3>${s.rebalance_notional_note ? `<p class="muted" style="font-size:.8rem">${escapeHtml(s.rebalance_notional_note)}</p>` : ''}<div class="scroll" style="max-height:340px"><table><thead><tr><th>日期</th><th>做多(金額)</th><th>做空(金額)</th><th class="num">該期報酬</th></tr></thead><tbody>${
          [...s.rebalances].reverse().map(r => `<tr><td>${escapeHtml(r.date)}</td><td>${escapeHtml(legs(r.long))}</td><td>${escapeHtml(legs(r.short))}</td><td class="num" style="color:${(r.period_return||0) >= 0 ? 'var(--good)' : '#db6b78'}">${(100*(r.period_return||0)).toFixed(2)}%</td></tr>`).join('')
        }</tbody></table></div>`;
  }
  const window = Array.isArray(s.window) ? `<span class="muted">回測窗口 ${escapeHtml(s.window[0])} → ${escapeHtml(s.window[1])}</span>` : '';
  return `<div class="strategy">
    <h3 style="margin-bottom:2px">${escapeHtml(s.name)}</h3>
    ${chip} ${window}
    <p class="muted">${escapeHtml(s.description || '')}</p>
    <p class="muted" style="font-size:.85rem">${escapeHtml(s.status_label || '')}</p>
    ${tiles}
    <canvas id="strategy-curve-${index}" role="img" aria-label="累計報酬曲線"></canvas>
    <p class="muted" style="font-size:.8rem;margin-top:4px">累計報酬(非複利、含成本回測)</p>
    ${extra}
  </div>`;
}

async function renderStrategies() {
  let data;
  try { data = await fetchJson('./strategies.json'); }
  catch (error) { $('strategies-body').innerHTML = `<p class="muted">策略快照尚未產生（${escapeHtml(error.message)}）。</p>`; return; }
  const list = data.strategies || [];
  $('strategies-body').innerHTML = list.map((s,i) => strategyCard(s,i)).join('') || '<p class="muted">無策略資料。</p>';
  list.forEach((s,i) => {
    const curve = Array.isArray(s.equity) ? s.equity.map(row => row.cum) : [];
    drawLine($(`strategy-curve-${i}`), curve, i === 0 ? '#63d7a2' : '#5aa8ff');
  });
}

async function main() {
  try {
    WORKLOG = await fetchJson('./worklog.json');
    for (const [id, tab] of [['tab-day','day'],['tab-week','week'],['tab-month','month']]) $(id).addEventListener('click', () => renderHoursTab(tab));
    renderHoursTab('day');
    renderActivity(WORKLOG.daily_activity || []);
    renderOutputs(WORKLOG.ai_outputs || []);
    $('generated-at').textContent = text(WORKLOG.generated_at);
    await renderStrategies();
  } catch (error) {
    $('error').hidden = false; $('error-message').textContent = error.message;
  }
}
main();
</script>
</body>
</html>
