    attribution: "Data source: Deribit public options trade history"
    adapter: deribit_option_flow
    currency: BTC
    fail_on_empty_fetch: true
    required: true
    notes: "Hourly inverse BTC option-flow aggregate. value_num is put-vs-call taker-buy premium imbalance; fields record BTC premium volumes, IV, trade counts, liquidation count, and USDC-linear exclusion count. New ingests retain the full inverse trade tape in raw_payload (sample_rule=all_inverse_trades_in_hour, including trade_id); a complete BTC+ETH history enrichment is estimated at 1.5-2.0 GB. The 2024-01+ re-backfill is STOPPED/PARTIAL after upstream archive revisions changed the previously stored BTC aggregate trade total by -5; do not treat historical retention as complete until Claude/user resolves aggregate immutability. Fields also include per-hour moneyness premium/trade buckets and OTM taker-buy amounts. Ingestion auto-selects history.deribit.com for starts older than 2 days and www.deribit.com otherwise."

  optflow_deribit_eth:
