  rv30_deribit_btc_1h:
    provider: deribit
    frequency: hourly
    value_kind: scalar
    max_age_seconds: 7200
    source_url: https://www.deribit.com/api/v2/public/get_tradingview_chart_data
    attribution: "Derived from Deribit BTC-PERPETUAL hourly closes"
    adapter: deribit_realized_volatility
    on_demand: true
    currency: BTC
    window_hours: 720
    fail_on_empty_fetch: true
    required: false
    notes: "Derived 30-day close-to-close realized volatility from BTC-PERPETUAL: sample standard deviation of 720 hourly log returns, annualized by sqrt(365*24), in percent. This is neither Deribit's index-price series nor its native historical-volatility endpoint. Backfilled from 2018-09-14; calibration vs hv_deribit_btc_1h over the ~16-day overlap where both exist: corr 0.745, mean diff -8.66 vol pts (official HV below RV30), n=395."

