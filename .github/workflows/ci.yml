name: CI

on:
  pull_request:
  push:
    branches:
      - main

# `public-status` is an orphan publication branch holding only .nojekyll,
# index.html, and status.json (docs/RUNBOOK.md). It shares no history with
# `main`, must never be merged, and carries none of the source these jobs
# check, so every job skips it instead of reporting a misleading red X.

jobs:
  unit:
    name: Ruff and unit tests
    if: github.head_ref != 'public-status' && github.ref_name != 'public-status'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests backtesting scripts

      - name: Install crypto-alpha-lab
        run: python -m pip install -e research/crypto-alpha-lab

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run root-level synthetic backtest tests
        run: pytest tests/test_daily_winner_backtest.py tests/test_ohlcv_rotation.py -v

      - name: Run crypto-alpha-lab tests
        run: python -m pytest research/crypto-alpha-lab/tests -p no:cacheprovider -q

  docs:
    name: Documentation checks
    if: github.head_ref != 'public-status' && github.ref_name != 'public-status'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Doc lifecycle metadata and feature-map links
        run: |
          python scripts/docs/check_doc_metadata.py
          python scripts/docs/check_feature_map_links.py

      - name: Doc impact matrix (strict on PRs, advisory on push)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            DOC_IMPACT_BASE="origin/${BASE_REF}" python scripts/docs/check_doc_impact.py --strict
          else
            python scripts/docs/check_doc_impact.py
          fi

  strategy-signal-validation:
    name: Strategy signal validation
    if: github.head_ref != 'public-status' && github.ref_name != 'public-status'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev,validation]"

      - name: Run active-strategy signal validation
        run: make strategy-signal-validation VALIDATION_RESULTS_DIR="$RUNNER_TEMP/strategy_validation"
